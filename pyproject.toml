[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "harness-sync-config"
version = "0.1.0a1"
description = "Shared configuration and synchronization framework for coding harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "ruamel.yaml>=0.18,<0.19", "tomlkit>=0.13,<1"]

[project.scripts]
harness-sync = "harness_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_sync", "harnesses"]

[tool.pytest.ini_options]
testpaths = ["tests", "harnesses"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
